  <text x="195" y="396" font-size="14" fill="#6B7280" text-anchor="middle">Premium yet.</text>

  <!-- Offer summary card -->
  <rect x="24" y="424" width="342" height="120" rx="16" fill="#FFFFFF"/>
  <rect x="44" y="444" width="48" height="48" rx="10" fill="#EB1000"/>
  <text x="68" y="475" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ex</text>
  <text x="106" y="464" font-size="15" font-weight="600" fill="#1A1A1A">Adobe Express Premium</text>
  <text x="106" y="484" font-size="13" fill="#6B7280">Included in your plan</text>
  <text x="106" y="518" font-size="12" fill="#9AA0A6">Create, edit, and share content</text>

  <!-- Claim CTA -> FS-001 -->
  <rect x="24" y="566" width="342" height="52" rx="14" fill="#EB1000"/>
  <text x="195" y="599" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Claim Adobe Express Premium</text>

