  <rect x="163" y="208" width="64" height="64" rx="14" fill="#EB1000" opacity="0.12"/>
  <text x="195" y="252" font-size="32" text-anchor="middle" fill="#EB1000">✦</text>

  <!-- Copy -->
  <text x="195" y="346" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">Not yet activated</text>
