<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Screen background -->
  <rect width="390" height="844" rx="40" fill="#F4F5F7"/>

  <!-- Status bar -->
  <text x="28" y="32" font-size="13" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="318" y="22" width="18" height="11" rx="2" fill="#FFFFFF"/>
  <rect x="340" y="20" width="22" height="13" rx="3" fill="#FFFFFF"/>
  <rect x="364" y="23" width="2" height="7" rx="1" fill="#FFFFFF"/>

  <!-- Partner top bar -->
  <path d="M0 40 h390 v60 H0 Z" fill="#1473E6"/>
  <path d="M0 0 h390 v40 H0 Z" fill="#1473E6"/>
  <text x="28" y="76" font-size="20" fill="#FFFFFF">‹</text>
  <text x="195" y="76" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">My Subscription</text>

  <!-- Skeleton status card -->
  <rect x="16" y="116" width="358" height="178" rx="16" fill="#FFFFFF"/>
  <rect x="32" y="136" width="54" height="54" rx="12" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="144" width="190" height="14" rx="7" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="168" width="64" height="16" rx="8" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
  </rect>

  <rect x="32" y="218" width="84" height="10" rx="5" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.15s" repeatCount="indefinite"/>
  </rect>
  <rect x="32" y="236" width="116" height="12" rx="6" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.25s" repeatCount="indefinite"/>
  </rect>
  <rect x="200" y="218" width="84" height="10" rx="5" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="200" y="236" width="116" height="12" rx="6" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <line x1="32" y1="266" x2="358" y2="266" stroke="#EEF0F2" stroke-width="1"/>
  <rect x="32" y="278" width="230" height="12" rx="6" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
  </rect>

  <!-- Skeleton button -->
  <rect x="16" y="312" width="358" height="52" rx="14" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Skeleton manage row -->
  <rect x="16" y="380" width="358" height="56" rx="16" fill="#FFFFFF"/>
  <rect x="32" y="401" width="170" height="14" rx="7" fill="#E7EAEE">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.4s" begin="0.45s" repeatCount="indefinite"/>
  </rect>

