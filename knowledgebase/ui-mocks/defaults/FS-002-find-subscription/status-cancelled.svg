<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Screen background -->
  <rect width="390" height="844" rx="40" fill="#F4F5F7"/>

  <!-- Status bar -->
  <text x="28" y="32" font-size="13" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="318" y="22" width="18" height="11" rx="2" fill="#FFFFFF"/>
  <rect x="340" y="20" width="22" height="13" rx="3" fill="#FFFFFF"/>
  <rect x="364" y="23" width="2" height="7" rx="1" fill="#FFFFFF"/>

  <!-- Partner top bar -->
  <path d="M0 40 h390 v60 H0 Z" fill="#1473E6"/>
  <path d="M0 0 h390 v40 H0 Z" fill="#1473E6"/>
  <text x="28" y="76" font-size="20" fill="#FFFFFF">‹</text>
  <text x="195" y="76" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">My Subscription</text>

  <!-- Status card -->
  <rect x="16" y="116" width="358" height="178" rx="16" fill="#FFFFFF"/>
  <rect x="32" y="136" width="54" height="54" rx="12" fill="#EB1000" opacity="0.5"/>
  <text x="59" y="170" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ex</text>
  <text x="100" y="156" font-size="16" font-weight="700" fill="#1A1A1A">Adobe Express Premium</text>
  <rect x="100" y="166" width="78" height="22" rx="11" fill="#ECEEF1"/>
  <circle cx="115" cy="177" r="4" fill="#8A9099"/>
  <text x="151" y="181" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">Cancelled</text>

  <text x="32" y="226" font-size="11" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">STARTED</text>
  <text x="32" y="246" font-size="14" font-weight="600" fill="#1A1A1A">Jan 29, 2026</text>
  <text x="200" y="226" font-size="11" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">STATUS</text>
  <text x="200" y="246" font-size="14" font-weight="600" fill="#1A1A1A">Access ended</text>

  <line x1="32" y1="266" x2="358" y2="266" stroke="#EEF0F2" stroke-width="1"/>
  <text x="32" y="286" font-size="13" fill="#6B7280">Your access ended when you cancelled</text>

  <!-- Re-activate button -->
  <rect x="16" y="312" width="358" height="52" rx="14" fill="#EB1000"/>
  <text x="195" y="345" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Re-activate Adobe Express Premium</text>

  <!-- Info card -->
  <rect x="16" y="380" width="358" height="108" rx="16" fill="#FFFFFF"/>
  <text x="32" y="410" font-size="13" font-weight="600" fill="#1A1A1A">Your subscription is cancelled</text>
  <text x="32" y="434" font-size="12" fill="#6B7280">Your subscription was cancelled and</text>
  <text x="32" y="452" font-size="12" fill="#6B7280">access has ended. Re-activate anytime</text>
  <text x="32" y="470" font-size="12" fill="#6B7280">to continue.</text>
</svg>
