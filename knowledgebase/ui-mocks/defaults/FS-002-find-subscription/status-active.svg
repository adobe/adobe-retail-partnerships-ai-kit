  <circle cx="115" cy="177" r="4" fill="#1E9E54"/>
  <text x="143" y="181" font-size="11" font-weight="600" fill="#1E9E54" text-anchor="middle">Active</text>

  <text x="32" y="226" font-size="11" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">STARTED</text>
  <text x="32" y="246" font-size="14" font-weight="600" fill="#1A1A1A">Jan 29, 2026</text>
  <text x="200" y="226" font-size="11" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">VALID UNTIL</text>
  <text x="200" y="246" font-size="14" font-weight="600" fill="#1A1A1A">Jan 28, 2027</text>

  <line x1="32" y1="266" x2="358" y2="266" stroke="#EEF0F2" stroke-width="1"/>
