<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Screen background -->
  <rect width="390" height="844" rx="40" fill="#F4F5F7"/>

  <!-- Status bar -->
  <text x="28" y="32" font-size="13" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="318" y="22" width="18" height="11" rx="2" fill="#FFFFFF"/>
  <rect x="340" y="20" width="22" height="13" rx="3" fill="#FFFFFF"/>
  <rect x="364" y="23" width="2" height="7" rx="1" fill="#FFFFFF"/>

  <!-- Partner top bar -->
  <path d="M0 40 h390 v60 H0 Z" fill="#1473E6"/>
  <path d="M0 0 h390 v40 H0 Z" fill="#1473E6"/>
  <circle cx="36" cy="70" r="10" fill="rgba(255,255,255,0.25)"/>
  <text x="36" y="75" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">P</text>
  <text x="56" y="76" font-size="17" font-weight="700" fill="#FFFFFF">Partner App</text>

  <!-- Section label: chip states -->
  <text x="24" y="142" font-size="12" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">STATUS CHIP — STATES</text>

  <!-- Active chip -->
  <rect x="24" y="156" width="120" height="34" rx="17" fill="#E3F4E9"/>
  <circle cx="46" cy="173" r="5" fill="#1E9E54"/>
  <text x="60" y="178" font-size="13" font-weight="600" fill="#1E9E54">Active</text>

  <!-- Pending chip -->
  <rect x="160" y="156" width="128" height="34" rx="17" fill="#FEF4E0"/>
  <circle cx="182" cy="173" r="5" fill="#E59500"/>
  <text x="196" y="178" font-size="13" font-weight="600" fill="#A56400">Pending</text>

  <!-- Not activated chip -->
  <rect x="24" y="202" width="158" height="34" rx="17" fill="#ECEEF1"/>
  <circle cx="46" cy="219" r="5" fill="#9AA0A6"/>
  <text x="60" y="224" font-size="13" font-weight="600" fill="#6B7280">Not activated</text>

  <!-- Cancelled chip -->
  <rect x="198" y="202" width="138" height="34" rx="17" fill="#ECEEF1"/>
  <circle cx="220" cy="219" r="5" fill="#8A9099"/>
  <text x="234" y="224" font-size="13" font-weight="600" fill="#6B7280">Cancelled</text>

  <!-- In-context example label -->
  <text x="24" y="290" font-size="12" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">ON AN OFFER CARD</text>

  <!-- Example offer card with live chip -->
  <rect x="16" y="306" width="358" height="100" rx="16" fill="#FFFFFF"/>
  <rect x="36" y="330" width="52" height="52" rx="12" fill="#EB1000"/>
  <text x="62" y="363" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ex</text>
  <text x="104" y="346" font-size="15" font-weight="700" fill="#1A1A1A">Adobe Express Premium</text>
  <text x="104" y="366" font-size="12" fill="#6B7280">You have access — tap to Manage</text>
  <rect x="104" y="376" width="78" height="22" rx="11" fill="#E3F4E9"/>
  <circle cx="120" cy="387" r="4" fill="#1E9E54"/>
  <text x="148" y="391" font-size="11" font-weight="600" fill="#1E9E54" text-anchor="middle">Active</text>
  <text x="330" y="366" font-size="12" font-weight="600" fill="#1473E6" text-anchor="end">Manage</text>
  <text x="348" y="362" font-size="20" fill="#C4C9CF" text-anchor="middle">›</text>

  <!-- Second example card: not activated -->
  <rect x="16" y="418" width="358" height="100" rx="16" fill="#FFFFFF"/>
  <rect x="36" y="442" width="52" height="52" rx="12" fill="#EB1000"/>
  <text x="62" y="475" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ex</text>
  <text x="104" y="458" font-size="15" font-weight="700" fill="#1A1A1A">Adobe Express Premium</text>
  <text x="104" y="478" font-size="12" fill="#6B7280">Included with your plan</text>
  <rect x="104" y="488" width="100" height="22" rx="11" fill="#ECEEF1"/>
  <circle cx="120" cy="499" r="4" fill="#9AA0A6"/>
  <text x="162" y="503" font-size="11" font-weight="600" fill="#6B7280" text-anchor="middle">Not activated</text>
  <text x="348" y="474" font-size="20" fill="#C4C9CF" text-anchor="middle">›</text>
</svg>
