  <circle cx="48" cy="494" r="16" fill="#FDEAE7"/>
  <text x="48" y="499" font-size="14" text-anchor="middle" fill="#EB1000">✦</text>
  <text x="76" y="490" font-size="14" font-weight="600" fill="#1A1A1A">Remove backgrounds instantly</text>
  <text x="76" y="508" font-size="12" fill="#6B7280">AI-powered tools, no skills needed</text>

