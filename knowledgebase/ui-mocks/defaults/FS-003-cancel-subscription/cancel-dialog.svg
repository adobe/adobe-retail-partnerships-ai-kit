<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Dimmed underlying screen -->
  <rect width="390" height="844" rx="40" fill="#1A1A1A"/>
  <rect width="390" height="844" rx="40" fill="#F4F5F7" opacity="0.35"/>

  <!-- Faint partner top bar behind the sheet -->
  <path d="M0 40 h390 v60 H0 Z" fill="#1473E6" opacity="0.5"/>
  <path d="M0 0 h390 v40 H0 Z" fill="#1473E6" opacity="0.5"/>
  <text x="195" y="76" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.7">My Subscription</text>

  <!-- Bottom sheet modal -->
  <path d="M0 470 h390 v374 a40 40 0 0 1 -40 40 H40 a40 40 0 0 1 -40 -40 Z" fill="#FFFFFF"/>
  <path d="M0 470 h390 v24 H0 Z" fill="#FFFFFF"/>
  <rect x="0" y="470" width="390" height="24" rx="24" fill="#FFFFFF"/>

  <!-- Drag handle -->
  <rect x="172" y="486" width="46" height="4" rx="2" fill="#DADDE1"/>

  <!-- Product icon -->
  <rect x="163" y="510" width="64" height="64" rx="16" fill="#FDEAE7"/>
  <rect x="171" y="518" width="48" height="48" rx="10" fill="#EB1000"/>
  <text x="195" y="548" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ex</text>

  <!-- Heading -->
  <text x="195" y="602" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cancel Adobe Express</text>
  <text x="195" y="624" font-size="19" font-weight="700" fill="#1A1A1A" text-anchor="middle">Premium?</text>

  <!-- Body -->
  <text x="195" y="656" font-size="14" fill="#4B5563" text-anchor="middle">Your access will end immediately.</text>
  <text x="195" y="676" font-size="14" fill="#4B5563" text-anchor="middle">This can't be undone.</text>

  <!-- Confirm cancel (destructive) -->
  <rect x="24" y="702" width="342" height="52" rx="14" fill="#FDEAE7"/>
  <text x="195" y="735" font-size="15" font-weight="700" fill="#C81E00" text-anchor="middle">Cancel subscription</text>

  <!-- Keep button -->
  <rect x="24" y="766" width="342" height="52" rx="14" fill="#F1F2F4"/>
  <text x="195" y="799" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="middle">Keep my subscription</text>
</svg>
