<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Screen background -->
  <rect width="390" height="844" rx="40" fill="#FFFFFF"/>

  <!-- Status bar -->
  <text x="28" y="32" font-size="13" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="318" y="22" width="18" height="11" rx="2" fill="#FFFFFF"/>
  <rect x="340" y="20" width="22" height="13" rx="3" fill="#FFFFFF"/>
  <rect x="364" y="23" width="2" height="7" rx="1" fill="#FFFFFF"/>

  <!-- Partner top bar -->
  <path d="M0 40 h390 v60 H0 Z" fill="#1473E6"/>
  <path d="M0 0 h390 v40 H0 Z" fill="#1473E6"/>
  <text x="195" y="76" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">My Subscription</text>

  <!-- Illustration (neutral end-state) -->
  <circle cx="195" cy="240" r="78" fill="#F4F5F7"/>
  <circle cx="195" cy="240" r="56" fill="#E7EAEE"/>
  <line x1="176" y1="221" x2="214" y2="259" stroke="#8A9099" stroke-width="5" stroke-linecap="round"/>
  <line x1="214" y1="221" x2="176" y2="259" stroke="#8A9099" stroke-width="5" stroke-linecap="round"/>

  <!-- Heading -->
  <text x="195" y="350" font-size="22" font-weight="700" fill="#1A1A1A" text-anchor="middle">Subscription cancelled</text>

  <!-- Access note -->
  <rect x="24" y="376" width="342" height="74" rx="16" fill="#F4F5F7"/>
  <text x="195" y="406" font-size="14" fill="#4B5563" text-anchor="middle">Your Adobe Express Premium</text>
  <text x="195" y="430" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">access has ended.</text>

  <!-- Detail row -->
  <rect x="24" y="466" width="342" height="58" rx="16" fill="#F4F5F7"/>
  <text x="48" y="492" font-size="11" font-weight="600" fill="#9AA0A6" letter-spacing="0.5">STATUS</text>
  <text x="48" y="512" font-size="13" font-weight="500" fill="#1A1A1A">Cancelled · access ended</text>

  <!-- Done button -->
  <rect x="24" y="546" width="342" height="52" rx="14" fill="#1473E6"/>
  <text x="195" y="579" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Done</text>

  <!-- Re-activate link -->
  <text x="195" y="632" font-size="14" font-weight="600" fill="#EB1000" text-anchor="middle">Re-activate later</text>

  <!-- Fine print -->
  <text x="195" y="692" font-size="12" fill="#9AA0A6" text-anchor="middle">Changed your mind? You can re-subscribe</text>
  <text x="195" y="710" font-size="12" fill="#9AA0A6" text-anchor="middle">at any time from the benefits screen.</text>
</svg>
